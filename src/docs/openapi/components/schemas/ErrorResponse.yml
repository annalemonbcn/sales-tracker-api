type: object
properties:
  success:
    type: boolean
    example: false
  error:
    type: object
    properties:
      code:
        type: string
        example: VALIDATION_ERROR
      message:
        type: string
        example: Invalid request data
      details:
        type: object
        nullable: true
    required:
      - code
      - message
required:
  - success
  - error
