get:
  summary: Get business activities
  description: Returns the activity timeline for a specific business.
  tags:
    - Activities
  parameters:
    - $ref: ../components/parameters/BusinessId.yml
  responses:
    "200":
      description: Activities returned successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      $ref: ../components/schemas/ActivityDto.yml
            required:
              - success
              - data
    "400":
      description: Invalid businessId
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
    "404":
      description: Business not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
  operationId: getBusinessActivities
post:
  summary: Create manual activity
  description: Creates a manual activity for a business. Some activity types automatically update the business status or lastContactedAt.
  tags:
    - Activities
  parameters:
    - $ref: ../components/parameters/BusinessId.yml
  requestBody:
    $ref: ../components/requestBodies/CreateActivity.yml
  responses:
    "201":
      description: Activity created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  activity:
                    $ref: ../components/schemas/ActivityDto.yml
            required:
              - success
              - data
    "400":
      description: Invalid request params or body
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
    "404":
      description: Business or user not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
  operationId: createActivity
