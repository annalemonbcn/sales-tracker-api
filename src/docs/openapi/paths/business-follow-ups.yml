get:
  summary: Get business follow-ups
  description: Returns follow-ups linked to a specific business.
  tags:
    - Follow-ups
  parameters:
    - $ref: ../components/parameters/BusinessId.yml
  responses:
    "200":
      description: Follow-ups returned successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  followUps:
                    type: array
                    items:
                      $ref: ../components/schemas/FollowUpDto.yml
            required:
              - success
              - data
    "400":
      description: Invalid businessId
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
    "404":
      description: Business not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
  operationId: getBusinessFollowUps
post:
  summary: Create business follow-up
  description: Creates a follow-up task for a specific business. It also creates a follow_up_created activity and updates business.nextFollowUpAt when the new task is the nearest pending follow-up.
  tags:
    - Follow-ups
  parameters:
    - $ref: ../components/parameters/BusinessId.yml
  requestBody:
    $ref: ../components/requestBodies/CreateFollowUp.yml
  responses:
    "201":
      description: Follow-up created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  followUp:
                    $ref: ../components/schemas/FollowUpDto.yml
            required:
              - success
              - data
    "400":
      description: Invalid request params or body
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
    "404":
      description: Business, creating user or assigned user not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
  operationId: createFollowUp
