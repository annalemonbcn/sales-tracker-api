patch:
  summary: Cancel follow-up
  description: Cancels a follow-up, creates a follow_up_cancelled activity and recalculates business.nextFollowUpAt.
  tags:
    - Follow-ups
  parameters:
    - $ref: ../components/parameters/FollowUpId.yml
  requestBody:
    $ref: ../components/requestBodies/CancelFollowUp.yml
  responses:
    "200":
      description: Follow-up cancelled successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  followUp:
                    $ref: ../components/schemas/FollowUpDto.yml
            required:
              - success
              - data
    "400":
      description: Invalid followUpId or userId
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
    "404":
      description: Follow-up or user not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yml
  operationId: cancelFollowUp
